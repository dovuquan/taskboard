    else if (!visible.length && !ui.newBoard) body = wsMembers.length === 1
      ? `<div class="empty"><h2>Welcome to Taskboard</h2><p>You're the first one here. Create a board for a project or team; colleagues join the workspace the first time they sign in with their asnet.com.vn account.</p><button class="btn primary" type="button" data-act="new-board">${ic('plus')} Create the first board</button></div>`
      : `<div class="empty"><h2>No boards yet</h2><p>A board holds lists of cards for one project or team. Create the first one, for example "Q4 Launch".</p><button class="btn primary" type="button" data-act="new-board">${ic('plus')} New board</button></div>`;
    else {
      const total = lists.reduce((n, l) => n + l.cards.length, 0);
      body = `<div class="boards">${visible.map(b => {
        const myRole = isAdmin() ? 'owner' : b.id === 'q4' ? (boardMembers[me()] || 'observer') : (b.members.includes(me()) ? 'member' : 'observer');
        return `<button class="board-tile" type="button" data-board="${b.id}">
          <span class="top"><span class="sq" style="background:var(${b.color})"></span><strong>${esc(b.id === 'q4' ? boardName : b.name)}</strong>${(b.id === 'q4' ? boardPrivate : b.priv) ? `<span title="Private board">${ic('lock')}</span>` : ''}</span>
          <span class="meta"><span>${b.id === 'q4' ? lists.length : b.lists} lists</span><span>·</span><span>${b.id === 'q4' ? total : b.cardsN} cards</span><span>·</span><span>Updated ${b.updated}</span></span>
          <span class="foot"><span class="stack">${b.members.slice(0, 4).map(m => av(m)).join('')}</span>${myRole ? `<span class="chip">${myRole === 'owner' ? 'Owner' : myRole === 'observer' ? 'Observer' : 'Member'}</span>` : ''}</span>
        </button>`; }).join('')}
        ${ui.newBoard ? `<form class="board-tile new-form" id="nb-form"><strong>New board</strong><input class="input" id="nb-name" placeholder="Board name" maxlength="80" required><label class="fine"><input type="checkbox" id="nb-priv"> Private: only people you add can see it</label><span class="foot"><button class="btn primary sm" type="submit">Create</button><button class="btn ghost sm" type="button" data-act="cancel-board">Cancel</button></span></form>`
          : `<button class="board-tile new-tile" type="button" data-act="new-board">${ic('plus')} New board</button>`}
      </div>`;
    }
    const extra = l.status !== 'ok' ? '' : [
      boardArchived && (isAdmin() || boardMembers[me()] === 'owner') ? `<section class="sub-sec"><h2>Archived boards</h2><div class="person-row"><span class="sq" style="background:var(--l-launch)"></span><b>${esc(boardName)}</b><span class="muted">Archived just now · its lists and cards are kept</span><button class="btn sm" type="button" data-act="restore-board">Restore</button></div></section>` : '',
      isAdmin() && boards.some(b => b.ownerless) ? `<section class="sub-sec"><h2>Boards without an owner</h2><p class="fine">Private boards whose owners have all left. Only admins see this list.</p>${boards.filter(b => b.ownerless).map(b => `<div class="person-row">${ic('lock')}<b>${esc(b.name)}</b><span class="muted">${b.cardsN} cards · updated ${b.updated}</span><button class="btn sm" type="button" data-own="${b.id}">Take ownership</button></div>`).join('')}</section>` : '',
    ].join('');
    return appbar('<span>/</span><span>Boards</span>') + `<div class="page gutter">${head}${body}${extra}</div>`;
  }

  function cardMatches(id) {
    const c = cards[id], f = ui.filter;
    if (f.q && !c.title.toLowerCase().includes(f.q.toLowerCase())) return false;
    if (f.member && !c.members.includes(f.member)) return false;
    if (f.label && !c.labels.includes(f.label)) return false;
    if (f.due === 'over' && dueState(c.due, c) !== 'over') return false;
    if (f.due === 'soon' && dueState(c.due, c) !== 'soon') return false;
    if (f.due === 'none' && c.due) return false;
    return true;
  }

  function cardTile(id) {
    const c = cards[id];
    const ds = dueState(c.due, c);
    const done = c.checklist.filter(x => x.d).length;
    const comments = c.comments.filter(x => !x.act).length;
    return `<div class="card" role="button" tabindex="0" data-card="${id}" draggable="${canEdit()}" aria-label="${esc(c.title)}">
      <span class="cid mono">${id}</span>
      ${c.labels.length ? `<span class="labels">${c.labels.map(lbl).join('')}</span>` : ''}
      <span class="title" style="padding-right:${c.labels.length ? 0 : 44}px">${esc(c.title)}</span>
      <span class="badges">
        ${c.due ? `<span class="b due ${ds}" title="Due ${fmtDate(c.due)}">${ic('cal')}${fmtDate(c.due)}</span>` : ''}
        ${c.desc ? `<span class="b" title="Has a description">${ic('text')}</span>` : ''}
        ${c.checklist.length ? `<span class="b ${done === c.checklist.length ? 'done' : ''}" title="Checklist">${ic('check')}${done}/${c.checklist.length}</span>` : ''}
        ${comments ? `<span class="b" title="Comments">${ic('chat')}${comments}</span>` : ''}
        ${c.members.length ? `<span class="stack">${c.members.map(m => av(m)).join('')}</span>` : ''}
      </span>
    </div>`;
  }

  function screenBoard() {
    statebar('board');
    if (!boards.some(b => b.id === 'q4')) {
      return appbar('<span>/</span><a href="#boards">Boards</a>') + `<div class="page gutter"><div class="empty"><h2>This board isn't here</h2><p>It may have been archived, or you may not have access to it. Boards you can open are on the boards list.</p><a class="btn" href="#boards">Back to boards</a></div></div>`;
    }
    if (boardArchived) {
      const canRestore = isAdmin() || boardMembers[me()] === 'owner';
      return appbar('<span>/</span><a href="#boards">Boards</a>') + `<div class="page gutter"><div class="empty"><h2>${esc(boardName)} is archived</h2><p>Its lists, cards and comments are kept. ${canRestore ? 'Restore it to give everyone access again.' : 'Ask a board owner or a workspace admin to restore it.'}</p>${canRestore ? '<button class="btn primary" type="button" data-act="restore-board">Restore board</button>' : '<a class="btn" href="#boards">Back to boards</a>'}</div></div>`;
    }
    const myBoardRole = role === 'admin' ? 'owner' : role;
    const roleName = { owner: 'Owner', member: 'Member', observer: 'Observer' }[myBoardRole];
    const f = ui.filter;
    const total = lists.reduce((n, l) => n + l.cards.length, 0);
    const shown = lists.reduce((n, l) => n + l.cards.filter(cardMatches).length, 0);
    const filtering = f.q || f.member || f.label || f.due;
    const head = `<div class="gutter">
      <div class="board-head">
        <h1>${esc(boardName)}</h1>
        <span class="chip">${boardPrivate ? ic('lock') + ' Private' : ic('globe') + ' Workspace'}</span>
        <span class="chip accent">You: ${roleName}</span>
        <span class="spacer"></span>
        <span class="stack">${Object.keys(boardMembers).slice(0, 8).map(m => av(m)).join('')}${Object.keys(boardMembers).length > 8 ? `<span class="chip" title="${Object.keys(boardMembers).length} people on this board">+${Object.keys(boardMembers).length - 8}</span>` : ''}</span>
        <a class="btn" href="#archived">${ic('box')} Archived${archived.lists.length + archived.cards.length ? ` (${archived.lists.length + archived.cards.length})` : ''}</a>
        <button class="btn" type="button" data-go="board-settings">${canManage() ? ic('gear') + ' Settings and members' : ic('users') + ' Board info'}</button>
      </div>
      ${limitHit && canEdit() ? `<div class="banner warn" style="margin-bottom:12px">${ic('alert')} This board has reached ${LIMITS.cards.toLocaleString('en-US')} cards, the limit for one board. Archive cards to add new ones.</div>` : ''}
      ${role === 'observer' ? `<div class="banner" style="margin-bottom:12px">${ic('eye')} You can view this board but not change it. Ask a board owner for member access.</div>` : ''}
      <div class="filterbar" role="search" ${lists.length ? '' : 'hidden'}>
        <span class="search">${ic('search')}<input class="input" id="f-q" placeholder="Filter cards  ( / )" value="${esc(f.q)}" aria-label="Filter cards by title"></span>
        <select class="input" id="f-member" aria-label="Member"><option value="">Any member</option>${Object.keys(boardMembers).map(m => `<option value="${m}" ${f.member === m ? 'selected' : ''}>${esc(people[m].name)}</option>`).join('')}</select>
        <select class="input" id="f-label" aria-label="Label"><option value="">Any label</option>${Object.keys(labels).map(k => `<option value="${k}" ${f.label === k ? 'selected' : ''}>${labels[k].name}</option>`).join('')}</select>
        <select class="input" id="f-due" aria-label="Due date"><option value="">Any due date</option><option value="over" ${f.due === 'over' ? 'selected' : ''}>Overdue</option><option value="soon" ${f.due === 'soon' ? 'selected' : ''}>Due in 2 days</option><option value="none" ${f.due === 'none' ? 'selected' : ''}>No due date</option></select>
        ${filtering ? `<span class="count">Showing ${shown} of ${total} cards</span><button class="btn ghost sm" type="button" data-act="clear-filter">Clear</button>` : ''}
      </div>
    </div>`;
    let body;
    const l = ensure('board');
    if (l.status === 'loading') body = `<div class="lanes-wrap gutter" aria-busy="true"><div class="lanes">${[3, 2, 4, 1].map(n => `<div class="lane" style="padding:10px;gap:8px"><div class="skel" style="height:18px;width:60%"></div>${'<div class="skel" style="height:64px"></div>'.repeat(n)}</div>`).join('')}</div>${slowNote(l, 'board')}</div>`;
    else if (l.status === 'error') body = `<div class="page gutter">${loadFail(boardName, 'board', l)}</div>`;
    else if (!lists.length) body = `<div class="page gutter"><div class="empty"><h2>This board has no lists yet</h2><p>Lists are the columns cards move through, for example To do, Doing and Done.</p>${canEdit() ? `<button class="btn primary" type="button" data-act="seed-lists">${ic('plus')} Add To do, Doing, Done</button>` : '<p>Ask a board member to add the first lists.</p>'}</div></div>`;
    else body = `<div class="lanes-wrap gutter"><div class="lanes">
      ${lists.map(l => {
        const ids = l.cards.filter(cardMatches);
        return `<section class="lane" data-lane="${l.id}" aria-label="${esc(l.title)}">
          <div class="lane-head" ${canEdit() && ui.renameLane !== l.id ? `draggable="true" data-lanedrag="${l.id}" title="Drag to move the list"` : ''}>${canEdit() ? `<span class="grip" aria-hidden="true">${ic('grip')}</span>` : ''}${ui.renameLane === l.id
            ? `<input class="input lane-rename" id="lane-rename" value="${esc(l.title)}" maxlength="80" aria-label="List name" data-rename="${l.id}">`
            : `<h3 ${canEdit() ? `data-startrename="${l.id}" title="Click to rename"` : ''}>${esc(l.title)}</h3>`}<span class="n">${filtering ? ids.length + '/' : ''}${l.cards.length}</span>${canEdit() ? `<button class="icon-btn" type="button" data-pop="lane:${l.id}" aria-haspopup="menu" aria-expanded="${ui.pop === 'lane:' + l.id}" aria-label="List actions for ${esc(l.title)}">${ic('dots')}</button>` : ''}${ui.pop === 'lane:' + l.id ? laneMenu(l) : ''}</div>
          <div class="lane-body" data-drop="${l.id}">${ids.map(cardTile).join('')}</div>
          ${canEdit() && !limitHit ? (ui.composer === l.id
            ? `<form class="composer" data-composer="${l.id}"><textarea class="input" id="composer-${l.id}" placeholder="Card title" maxlength="200" aria-label="New card title"></textarea><div class="row"><button class="btn primary sm" type="submit">Add card</button><button class="btn ghost sm" type="button" data-act="close-composer">Cancel</button><span class="fine" style="margin-left:auto">Enter to add · Esc to close</span></div></form>`
            : `<button class="add-card" type="button" data-addcard="${l.id}">${ic('plus')} Add a card</button>`) : ''}
        </section>`; }).join('')}
      ${canEdit() && lists.length >= LIMITS.lists ? `<p class="fine lane-form">${LIMITS.lists} lists is the limit for one board. Archive a list to add another.</p>` : canEdit() ? (ui.addingLane
        ? `<form class="lane-form" id="lane-form"><input class="input" id="lane-new" placeholder="List name" maxlength="80" aria-label="New list name"><div class="row"><button class="btn primary sm" type="submit">Add list</button><button class="btn ghost sm" type="button" data-act="cancel-lane">Cancel</button><span class="fine" style="margin-left:auto">Enter · Esc</span></div></form>`
        : `<button class="add-lane" type="button" data-act="add-lane">${ic('plus')} Add list</button>`) : ''}
    </div></div>`;
    return appbar(`<span>/</span><a href="#boards">Boards</a><span>/</span><span>${esc(boardName)}</span>`) + head + body;
  }

  function screenArchived() {
    const crumbs = `<span>/</span><a href="#boards">Boards</a><span>/</span><a href="#board">${esc(boardName)}</a><span>/</span><span>Archived</span>`;
    const l = ensure('board');
    let body;
    if (l.status === 'loading') body = `<div aria-busy="true" style="display:flex;flex-direction:column;gap:8px">${'<div class="skel" style="height:44px"></div>'.repeat(4)}</div>${slowNote(l, 'board')}`;
    else if (l.status === 'error') body = loadFail('archived items', 'board', l);
    else if (boardArchived) body = `<div class="empty"><h2>${esc(boardName)} is archived</h2><p>Restore the board from the Boards page first.</p><a class="btn" href="#boards">Back to boards</a></div>`;
    else if (!archived.lists.length && !archived.cards.length) body = `<div class="empty"><h2>Nothing is archived on this board</h2><p>Archived lists and cards show up here. An owner can bring them back; nothing is deleted.</p><a class="btn" href="#board">Back to the board</a></div>`;
    else {
      const can = canManage();
      const restoreBtn = (attr, v) => can ? `<button class="btn sm" type="button" ${attr}="${v}">Restore</button>` : '';
      body = `${can ? '' : `<div class="banner" style="margin-bottom:12px">${ic('lock')} Only board owners can restore archived items.</div>`}
        ${archived.lists.length ? `<section class="sub-sec" style="margin-top:0"><h2>Lists (${archived.lists.length})</h2>${archived.lists.map((a, i) => `<div class="person-row"><b>${esc(a.lane.title)}</b><span class="muted">${a.lane.cards.length} card${a.lane.cards.length === 1 ? '' : 's'} · archived ${a.at}</span>${restoreBtn('data-restorelist', i)}</div>`).join('')}</section>` : ''}
        ${archived.cards.length ? `<section class="sub-sec"><h2>Cards (${archived.cards.length})</h2>${archived.cards.map((a, i) => `<div class="person-row"><span class="mono muted">${a.id}</span><b>${esc(cards[a.id].title)}</b><span class="muted">from ${esc(a.from)} · archived ${a.at}</span>${restoreBtn('data-restorecard', i)}</div>`).join('')}</section>` : ''}`;
    }
    return appbar(crumbs) + `<div class="page gutter"><div class="page-head"><div><h1>Archived on ${esc(boardName)}</h1><p class="muted" style="margin:4px 0 0">Archived lists and cards keep their comments, checklists and history.</p></div></div>${body}</div>`;
  }

  /* ---------- overlays ---------- */
  function cardModal(id) {
    const c = cards[id];
    const ro = !canEdit();
    const lid = listOf(id);
    const ds = dueState(c.due, c);
    const done = c.checklist.filter(x => x.d).length;
    const pct = c.checklist.length ? Math.round(done * 100 / c.checklist.length) : 0;
    const visible = c.checklist.map((x, i) => [x, i]).filter(([x]) => !(ui.hideChecked && x.d));
    const items = ui.allChecks ? visible : visible.slice(0, 6);
    const feed = ui.allFeed ? c.comments : c.comments.slice(0, 4);
    return `<div class="scrim" data-act="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="card-title" data-stop>
      <div class="modal-top">
        <span class="where"><span class="mono">${id}</span> · in list <b>${esc(listTitle(lid) || 'Archived')}</b> on ${esc(boardName)}</span>
        <span style="position:relative"><button class="btn sm" type="button" data-pop="cardmenu">${ic('dots')} Card menu</button>${ui.pop === 'cardmenu' ? cardMenu(id) : ''}</span>
        <button class="icon-btn" type="button" data-act="close-modal" aria-label="Close (Esc)">${ic('x')}</button>
      </div>
      <div class="modal-cols">
        <section>
          <input class="title-input" id="card-title" value="${esc(c.title)}" maxlength="200" ${ro ? 'disabled' : ''} aria-label="Card title">
          <div class="fields">
            <div class="field"><span class="lab">Members</span><div class="row">${c.members.map(m => av(m, 'lg')).join('') || '<span class="muted">Nobody yet</span>'}${ro ? '' : `<button class="add-dot" type="button" data-pop="members" aria-label="Change members">${ic('plus')}</button>`}${ui.pop === 'members' ? pickMembers(id) : ''}</div></div>
            <div class="field"><span class="lab">Labels</span><div class="row">${c.labels.map(lbl).join('') || '<span class="muted">None</span>'}${ro ? '' : `<button class="add-dot" type="button" data-pop="labels" aria-label="Change labels">${ic('plus')}</button>`}${ui.pop === 'labels' ? pickLabels(id) : ''}</div></div>
            <div class="field"><span class="lab">Due date</span><div class="row"><input type="date" class="input" id="card-due" value="${c.due}" ${ro ? 'disabled' : ''} aria-label="Due date">${ds === 'over' ? '<span class="chip" style="background:var(--danger-soft);color:var(--danger)">Overdue</span>' : ds === 'soon' ? '<span class="chip" style="background:var(--warn-soft);color:var(--warn)">Due soon</span>' : ''}</div></div>
          </div>
          <div>
            <div class="sec-head"><h3>${ic('text')} Description</h3>${!ro && !ui.editDesc && c.desc ? '<button class="btn sm" type="button" data-act="edit-desc">Edit</button>' : ''}</div>
            ${ui.editDesc ? `<textarea class="input" id="desc-input" rows="7" maxlength="10000">${esc(c.desc)}</textarea><div style="display:flex;gap:6px;margin-top:6px;align-items:center"><button class="btn primary sm" type="button" data-act="save-desc">Save</button><button class="btn ghost sm" type="button" data-act="cancel-desc">Cancel</button><span class="fine" style="margin-left:auto">Markdown: **bold**, *italic*, \`code\`, - lists</span></div>`
              : c.desc ? `<div class="md">${md(c.desc)}</div>` : (ro ? '<p class="muted">No description.</p>' : '<div class="md-empty" role="button" tabindex="0" data-act="edit-desc">Add a description. Markdown is supported.</div>')}
          </div>
          <div>
            <div class="sec-head"><h3>${ic('check')} Checklist</h3>${done ? `<button class="btn sm" type="button" data-act="toggle-hide">${ui.hideChecked ? `Show checked items (${done})` : 'Hide checked items'}</button>` : ''}</div>
            ${c.checklist.length ? `<div class="progress"><span>${done}/${c.checklist.length}</span><span class="bar ${pct === 100 ? 'full' : ''}"><i style="width:${pct}%"></i></span><span>${pct}%</span></div>` : ''}
            ${items.map(([x, i]) => `<div class="check ${x.d ? 'done' : ''}"><input type="checkbox" id="chk-${i}" data-check="${i}" ${x.d ? 'checked' : ''} ${ro ? 'disabled' : ''}><label for="chk-${i}">${rich(x.t)}</label>${ro ? '' : `<button class="del" type="button" data-delcheck="${i}" aria-label="Delete item: ${esc(x.t)}" title="Delete item">${ic('x')}</button>`}</div>`).join('')}
            ${ui.hideChecked && done === c.checklist.length && c.checklist.length ? '<p class="muted">Everything is checked.</p>' : ''}
            ${visible.length > 6 ? `<button class="linkish" type="button" data-act="toggle-checks">${ui.allChecks ? 'Show fewer' : `Show all ${visible.length}`}</button>` : ''}
            ${ro ? (c.checklist.length ? '' : '<p class="muted">No checklist.</p>') : `<form id="check-form" style="display:flex;gap:6px;margin-top:6px"><input class="input" id="check-new" placeholder="Add an item" maxlength="200" style="flex:1"><button class="btn sm" type="submit">Add</button></form>`}
          </div>
        </section>
        <section>
          <h3>Comments and activity</h3>
          ${ro ? '<p class="fine">Observers can read comments but not post.</p>' : `<form class="comment-box" id="comment-form"><textarea class="input" id="comment-new" rows="2" placeholder="Write a comment" maxlength="5000" aria-label="Write a comment"></textarea><div><button class="btn primary sm" type="submit">Comment</button></div></form>`}
          <div class="feed">${feed.map(e => e.act
            ? `<div class="entry activity"><span class="dot">${ic('act')}</span><div class="body who"><b>${esc(people[e.by].name)}</b> ${esc(e.text)}<span>${e.at}</span></div></div>`
            : commentEntry(c, e)).join('') || '<p class="muted">No comments yet.</p>'}</div>
          ${c.comments.length > 4 ? `<button class="linkish" type="button" data-act="toggle-feed">${ui.allFeed ? 'Show fewer' : `Show all ${c.comments.length}`}</button>` : ''}
        </section>
      </div>
    </div></div>`;
  }

  function laneMenu(l) {
    return `<div class="pop" role="menu" style="right:6px;top:36px">
      <span class="head">${esc(l.title)}</span>
      <button class="item" type="button" role="menuitem" data-laneact="add" data-lid="${l.id}">${ic('plus')} Add a card</button>
      <button class="item" type="button" role="menuitem" data-laneact="rename" data-lid="${l.id}">Rename list</button>
      <hr><button class="item danger" type="button" role="menuitem" data-laneact="archive" data-lid="${l.id}">Archive list${l.cards.length ? ` and its ${l.cards.length} card${l.cards.length === 1 ? '' : 's'}` : ''}</button>
    </div>`;
  }
  // Own comments can be edited or deleted for 24 hours (decision Q11).
  const recent = at => at === 'just now' || /^\d+[mh] ago$/.test(at);
  function commentEntry(c, e) {
    const i = c.comments.indexOf(e), mine = canEdit() && e.by === me() && recent(e.at);
    const text = ui.editComment === i
      ? `<textarea class="input" id="cedit-input" rows="2" maxlength="5000" aria-label="Edit your comment">${esc(e.text)}</textarea><div class="c-acts"><button class="btn primary sm" type="button" id="cedit-save">Save</button><button class="btn ghost sm" type="button" id="cedit-cancel">Cancel</button><span class="fine">Ctrl/⌘+Enter · Esc</span></div>`
      : `<div class="text">${rich(e.text)}</div>${mine ? `<div class="c-acts"><button class="linkish" type="button" data-cedit="${i}">Edit</button><span class="muted">·</span><button class="linkish" type="button" data-cdel="${i}">Delete</button></div>` : ''}`;
    return `<div class="entry">${av(e.by)}<div class="body"><div class="who"><b>${esc(people[e.by].name)}</b><span>${e.at}${e.edited ? ' · edited' : ''}</span></div>${text}</div></div>`;
  }
  function cardMenu(id) {
    const lid = listOf(id);
    if (!canEdit()) return `<div class="pop" style="right:0;top:34px"><button class="item" type="button" data-act="copy-link">Copy link</button></div>`;
    return `<div class="pop" style="right:0;top:34px">
      <span class="head">Move to</span>
      ${lists.filter(l => l.id !== lid).map(l => `<button class="item" type="button" data-moveto="${l.id}">${esc(l.title)}</button>`).join('')}
      <hr><button class="item" type="button" data-act="copy-card">Copy card</button>
      <button class="item" type="button" data-act="copy-link">Copy link</button>
      <hr><button class="item danger" type="button" data-act="archive-card">Archive card</button>
    </div>`;
  }
  function pickMembers(id) {
    const c = cards[id];
    const all = Object.keys(boardMembers).filter(m => boardMembers[m] !== 'observer');
    const q = ui.memQ.trim().toLowerCase();
    const shown = q ? all.filter(m => (people[m].name + ' ' + people[m].email).toLowerCase().includes(q)) : all;
    return `<div class="pop" style="left:0;top:34px"><span class="head">Board members</span>
      ${all.length > 8 ? `<input class="input find" id="pm-q" placeholder="Find a person" value="${esc(ui.memQ)}" aria-label="Find a board member">` : ''}
      <div class="scroll">${shown.map(m => `<label class="item"><input type="checkbox" data-mem="${m}" ${c.members.includes(m) ? 'checked' : ''}>${av(m)}${esc(people[m].name)}</label>`).join('') || '<span class="fine" style="padding:4px 8px">Nobody on this board matches.</span>'}</div>
      <span class="fine" style="padding:4px 8px">Observers can't be assigned.</span></div>`;
  }
  function pickLabels(id) {
    const c = cards[id];
    return `<div class="pop" style="left:0;top:34px"><span class="head">Labels</span>${Object.keys(labels).map(k => `<label class="item"><input type="checkbox" data-lab="${k}" ${c.labels.includes(k) ? 'checked' : ''}>${lbl(k)}</label>`).join('')}</div>`;
  }

  function settingsSheet() {
    const can = canManage();
    return `<div class="scrim" data-act="close-sheet" style="padding:0"></div><aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head"><h2 id="sheet-title">${can ? 'Board settings' : 'Board info'}</h2><button class="icon-btn" type="button" data-act="close-sheet" aria-label="Close (Esc)">${ic('x')}</button></div>
      <div class="sheet-body">
        ${can ? '' : `<div class="banner">${ic('lock')} Only board owners can change these settings.</div>`}
        <div class="group"><label class="lab" for="bs-name">Name</label><input class="input" id="bs-name" value="${esc(boardName)}" maxlength="80" ${can ? '' : 'disabled'}></div>
        <div class="group"><span class="lab">Who can see this board</span>
          <label class="radio"><input type="radio" name="vis" value="ws" ${boardPrivate ? '' : 'checked'} ${can ? '' : 'disabled'}><span><b>Workspace</b><small>Everyone in the asnet.com.vn workspace can open it as an observer. Members and owners are added below.</small></span></label>
          <label class="radio"><input type="radio" name="vis" value="priv" ${boardPrivate ? 'checked' : ''} ${can ? '' : 'disabled'}><span><b>Private</b><small>Only the people listed below can see it.</small></span></label>
        </div>
        <div class="group"><span class="lab">Board members (${Object.keys(boardMembers).length})</span>
          ${Object.keys(boardMembers).map(m => `<div class="person">${av(m, 'lg')}<div class="body">${esc(people[m].name)}${m === me() ? ' <span class="muted">(you)</span>' : ''}<small>${people[m].email}</small></div>
            ${can ? `<select class="input" id="br-${m}" data-brole="${m}" aria-label="Board role for ${esc(people[m].name)}"><option value="owner" ${boardMembers[m] === 'owner' ? 'selected' : ''}>Owner</option><option value="member" ${boardMembers[m] === 'member' ? 'selected' : ''}>Member</option><option value="observer" ${boardMembers[m] === 'observer' ? 'selected' : ''}>Observer</option></select>` : `<span class="chip">${boardMembers[m][0].toUpperCase() + boardMembers[m].slice(1)}</span>`}</div>`).join('')}
          ${can ? `<div class="add-person"><input class="input" id="ap-q" placeholder="Add a workspace member by name or email" value="${esc(ui.apQ)}" aria-label="Find a workspace member to add" autocomplete="off">${ui.apQ.trim() ? addMatches() : ''}</div><span class="fine">Owners change settings and members. Members edit lists and cards. Observers only read.</span>` : ''}
        </div>
        ${can ? `<div class="dangerbox"><b>Archive this board</b>${ui.confirmArchive
          ? `<p>Archive ${esc(boardName)}? Everyone loses access until an owner or admin restores it from Archived boards on the Boards page.</p><div style="display:flex;gap:6px"><button class="btn danger solid sm" type="button" data-act="archive-board">Archive board</button><button class="btn ghost sm" type="button" data-act="cancel-archive">Cancel</button></div>`
          : `<p>Hides the board from everyone. You can restore it later.</p><div><button class="btn danger sm" type="button" data-act="ask-archive">Archive board…</button></div>`}</div>` : ''}
      </div>
    </aside>`;
  }

  function addMatches() {
    const q = ui.apQ.trim().toLowerCase();
    const m = wsMembers.map(x => x[0]).filter(id => !boardMembers[id] && (people[id].name + ' ' + people[id].email).toLowerCase().includes(q)).slice(0, 6);
    return m.length ? `<div class="matches">${m.map(id => `<button class="item" type="button" data-addmem="${id}">${av(id)}<span>${esc(people[id].name)}<small>${esc(people[id].email)}</small></span></button>`).join('')}</div>`
      : `<p class="fine">Nobody in the workspace matches. People join the workspace the first time they sign in to Taskboard; then you can add them here.</p>`;
  }
  function keysSheet() {
    return `<div class="scrim" data-act="close-sheet" style="padding:0"></div><aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="keys-title">
      <div class="sheet-head"><h2 id="keys-title">Keyboard shortcuts</h2><button class="icon-btn" type="button" data-act="close-sheet" aria-label="Close (Esc)">${ic('x')}</button></div>
      <div class="sheet-body"><table class="keys"><tbody>
        <tr><td><kbd>n</kbd></td><td>Add a card to the first list</td></tr>
        <tr><td><kbd>/</kbd></td><td>Filter cards</td></tr>
        <tr><td><kbd>Esc</kbd></td><td>Close the dialog, or cancel what you are typing</td></tr>
        <tr><td><kbd>?</kbd></td><td>Show this list</td></tr>
        <tr><td><kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>Enter</kbd></td><td>Post the comment, or save the description, you are writing</td></tr>
        <tr><td><kbd>Enter</kbd></td><td>Open the focused card; add the card or list you are typing</td></tr>
      </tbody></table><p class="fine">Shortcuts don't fire while you are typing in a field. Observers can't add cards, so <kbd>n</kbd> does nothing for them.</p></div>
    </aside>`;
  }

  /* ---------- render ---------- */
  let overlay = null;
  function route() { return (location.hash || '#index').slice(1); }

  function render() {
    const r = route();
    const scr = $('#screen');
    renderNet(); renderProtoChrome();
    const key = dataKey(r);
    const gate = html => { scr.innerHTML = html; overlay = null; $('#overlay').innerHTML = ''; bind(); };
    if (key && proto.scenario === 'signedout' && !proto.signedIn) return gate(screenSignIn(true));
    if (key) { const l = ensure(key); if (l.status === 'error' && l.err.code === 401) return gate(screenExpired()); }
    const base ={ 'index': screenIndex, 'sign-in': screenSignIn, 'refused': screenRefused, 'members': screenMembers, 'boards': screenBoards, 'archived': screenArchived }[r];
    if (base) { scr.innerHTML = base(); if (overlay !== 'keys') overlay = null; }
    else { scr.innerHTML = screenBoard(); }
    if (r.startsWith('card/') && cards[r.slice(5)]) ui.openCard = r.slice(5);
    if (r === 'card' || r.startsWith('card/')) overlay = 'card';
    else if (r === 'board-settings') overlay = 'settings';
    else if (r === 'shortcuts') overlay = 'keys';
    else if (overlay === 'card' || overlay === 'settings') overlay = null;
    const ov = $('#overlay');
    if (overlay === 'card' && boardReady() && listOf(ui.openCard)) ov.innerHTML = cardModal(ui.openCard);
    else if (overlay === 'card' && boardReady()) ov.innerHTML = `<div class="scrim" data-act="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="gone-title" data-stop style="max-width:440px"><div class="empty" style="border:0"><h2 id="gone-title">This card isn't on the board</h2><p>It may have been archived or moved to another board. Its comments and checklist are kept.</p><button class="btn" type="button" data-act="close-modal">Back to the board</button></div></div></div>`;
    else if (overlay === 'settings') ov.innerHTML = settingsSheet();
    else if (overlay === 'keys') ov.innerHTML = keysSheet();
    else ov.innerHTML = '';
    bind();
  }

  function closeOverlay() {
    const r = route();
    ui.pop = null; ui.editDesc = false; ui.confirmArchive = false;
    overlay = null;
    if (['card', 'board-settings', 'shortcuts', 'filter'].includes(r.split('/')[0])) location.hash = 'board';
    else render();
  }

  function moveCard(id, toList, toIdx) {
    const from = lists.find(l => l.cards.includes(id));
    if (conflictPending) {
      // The fake server says someone else moved this card first (decision: last save wins, show where it is now).
      conflictPending = false;
      const other = lists.find(l => l.id !== toList && l.id !== from.id) || from;
      from.cards.splice(from.cards.indexOf(id), 1); other.cards.push(id);
      cards[id].comments.unshift({ act: true, by: 'dl', at: 'just now', text: `moved this card from ${from.title} to ${other.title}` });
      render();
      toast(`This card moved. Duc Le put it in ${other.title} a moment ago; it is shown there now.`);
      return;
    }
    const fromIdx = from.cards.indexOf(id);
    const to = lists.find(l => l.id === toList);
    const maxIdx = to.cards.length - (from === to ? 1 : 0);
    if (toIdx == null || toIdx > maxIdx) toIdx = maxIdx;
    if (from === to && fromIdx === toIdx) return;
    const entry = { act: true, by: me(), at: 'just now', text: `moved this card from ${from.title} to ${to.title}` };
    const doMove = () => { from.cards.splice(from.cards.indexOf(id), 1); to.cards.splice(toIdx, 0, id); cards[id].comments.unshift(entry); };
    const undoMove = () => {
      const i = to.cards.indexOf(id); if (i < 0) return;
      to.cards.splice(i, 1); from.cards.splice(fromIdx, 0, id);
      const e = cards[id].comments.indexOf(entry); if (e >= 0) cards[id].comments.splice(e, 1);
    };
    save(doMove, undoMove, `Moved ${id} to ${to.title}`, undoMove);
  }

  let dragId = null;
  function bind() {
    const root = document;
    root.querySelectorAll('[data-go]').forEach(el => el.onclick = () => { location.hash = el.dataset.go; });
    root.querySelectorAll('[data-board]').forEach(el => el.onclick = () => {
      if (el.dataset.board === 'q4') location.hash = 'board';
      else toast('Only Q4 Launch opens in this prototype.');
    });
    root.querySelectorAll('[data-card]').forEach(el => {
      el.onclick = () => { ui.openCard = el.dataset.card; ui.editComment = null; ui.allChecks = false; ui.allFeed = false; ui.editDesc = false; const h = 'card/' + el.dataset.card; if (route() === h) render(); else location.hash = h; };
      el.onkeydown = e => { if (e.key === 'Enter') el.click(); };
      el.ondragstart = e => { if (!canEdit()) { e.preventDefault(); return; } dragId = el.dataset.card; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (_) {} };
      el.ondragend = () => { el.classList.remove('dragging'); clearDrop(); dragId = null; };
    });
    root.querySelectorAll('[data-drop]').forEach(body => {
      body.ondragover = e => {
        if (!dragId) return;
        e.preventDefault();
        clearDrop();
        const target = dropTarget(body, e.clientY);
        if (target) target.classList.add('drop-before'); else body.classList.add('drop-end');
      };
      body.ondragleave = e => { if (!body.contains(e.relatedTarget)) clearDrop(); };
      body.ondrop = e => {
        e.preventDefault();
        if (!dragId) return;
        const target = dropTarget(body, e.clientY);
        const toList = body.dataset.drop;
        const to = lists.find(l => l.id === toList);
        let idx = target ? to.cards.indexOf(target.dataset.card) : to.cards.length;
        const from = lists.find(l => l.cards.includes(dragId));
        if (from.id === toList && from.cards.indexOf(dragId) < idx) idx -= 1;
        moveCard(dragId, toList, idx);
        dragId = null;
        render();
      };
    });
    root.querySelectorAll('[data-addcard]').forEach(el => el.onclick = () => openComposer(el.dataset.addcard));
    root.querySelectorAll('[data-composer]').forEach(form => {
      const ta = form.querySelector('textarea');
      const submit = () => {
        const t = ta.value.trim();
        if (!t) { ta.focus(); return; }
        const id = 'TB-' + nextId++;
        const lid = form.dataset.composer;
        save(() => {
          cards[id] = { title: t.slice(0, 200), labels: [], members: [], due: '', desc: '', checklist: [], comments: [{ act: true, by: me(), at: 'just now', text: `created this card in ${listTitle(lid)}` }] };
          lists.find(l => l.id === lid).cards.push(id);
        }, () => {
          const l = lists.find(x => x.id === lid); if (l && l.cards.includes(id)) l.cards.splice(l.cards.indexOf(id), 1);
          delete cards[id];
        });
        openComposer(lid);
      };
      form.onsubmit = e => { e.preventDefault(); submit(); };
      ta.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } };
    });
    root.querySelectorAll('[data-laneact]').forEach(el => el.onclick = () => {
      const lid = el.dataset.lid, a = el.dataset.laneact; ui.pop = null;
      if (a === 'add') return openComposer(lid);
      if (a === 'rename') { ui.renameLane = lid; render(); const i = $('#lane-rename'); if (i) i.select(); return; }
      const idx = lists.findIndex(x => x.id === lid), lane = lists[idx];
      const rec = { lane, at: 'just now' };
      const restore = () => { if (!lists.includes(lane)) lists.splice(Math.min(idx, lists.length), 0, lane); const i = archived.lists.indexOf(rec); if (i >= 0) archived.lists.splice(i, 1); };
      save(() => { lists.splice(lists.indexOf(lane), 1); archived.lists.unshift(rec); }, restore, `Archived ${lane.title}${lane.cards.length ? ` and its ${lane.cards.length} card${lane.cards.length === 1 ? '' : 's'}` : ''}. Nothing is deleted.`, restore);
    });
    root.querySelectorAll('[data-startrename]').forEach(el => el.onclick = () => { ui.renameLane = el.dataset.startrename; render(); const i = $('#lane-rename'); if (i) i.select(); });
    const rn = $('#lane-rename'); if (rn) {
      const finish = keep => {
        const lane = lists.find(x => x.id === rn.dataset.rename), v = rn.value.trim(), prev = lane && lane.title;
        ui.renameLane = null;
        if (keep && lane && v && v !== prev) save(() => { lane.title = v; }, () => { lane.title = prev; }, `Renamed to ${v}`);
        else render();
      };
      rn.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); finish(true); } else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false); } };
      rn.onblur = () => { if (ui.renameLane) finish(true); };
    }
    const lf = $('#lane-form'); if (lf) {
      const ln = $('#lane-new');
      lf.onsubmit = e => {
        e.preventDefault(); const v = ln.value.trim(); if (!v) { ln.focus(); return; }
        const lane = { id: 'l' + Date.now(), title: v.slice(0, 80), cards: [] };
        save(() => { lists.push(lane); }, () => { const i = lists.indexOf(lane); if (i >= 0) lists.splice(i, 1); }, `Added list ${lane.title}`);
        const n = $('#lane-new'); if (n) n.focus();
      };
    }
    root.querySelectorAll('[data-restorecard]').forEach(el => el.onclick = () => {
      const rec = archived.cards[+el.dataset.restorecard];
      const lane = lists.find(x => x.id === rec.lid) || lists[0];
      if (!lane) { toast('Add a list first; the card goes back into it.'); return; }
      save(() => { lane.cards.push(rec.id); archived.cards.splice(archived.cards.indexOf(rec), 1); }, () => { lane.cards.splice(lane.cards.indexOf(rec.id), 1); archived.cards.unshift(rec); }, `Restored ${rec.id} to ${lane.title}`);
    });
    root.querySelectorAll('[data-restorelist]').forEach(el => el.onclick = () => {
      const rec = archived.lists[+el.dataset.restorelist];
      save(() => { lists.push(rec.lane); archived.lists.splice(archived.lists.indexOf(rec), 1); }, () => { lists.splice(lists.indexOf(rec.lane), 1); archived.lists.unshift(rec); }, `Restored ${rec.lane.title} with its ${rec.lane.cards.length} cards`);
    });
    root.querySelectorAll('[data-own]').forEach(el => el.onclick = () => {
      const b = boards.find(x => x.id === el.dataset.own);
      save(() => { b.ownerless = false; b.members = [me()]; }, () => { b.ownerless = true; b.members = []; }, `You now own ${b.name}`);
    });
    root.querySelectorAll('[data-lanedrag]').forEach(h => {
      h.ondragstart = e => { if (!canEdit() || dragId) return; laneDrag = h.dataset.lanedrag; h.closest('.lane').classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', laneDrag); } catch (_) {} };
      h.ondragend = () => { laneDrag = null; document.querySelectorAll('.lane.dragging').forEach(x => x.classList.remove('dragging')); clearLaneDrop(); };
    });
    const lanesEl = $('.lanes'); if (lanesEl) {
      lanesEl.ondragover = e => { if (!laneDrag) return; e.preventDefault(); clearLaneDrop(); const t = laneTarget(e.clientX); if (t) t.classList.add('lane-drop-before'); else lanesEl.classList.add('lane-drop-end'); };
      lanesEl.ondrop = e => {
        if (!laneDrag) return; e.preventDefault();
        const t = laneTarget(e.clientX), lane = lists.find(x => x.id === laneDrag), from = lists.indexOf(lane);
        let to = t ? lists.findIndex(x => x.id === t.dataset.lane) : lists.length;
        if (from < to) to -= 1;
        laneDrag = null; clearLaneDrop();
        if (to === from) { render(); return; }
        save(() => { lists.splice(lists.indexOf(lane), 1); lists.splice(to, 0, lane); }, () => { lists.splice(lists.indexOf(lane), 1); lists.splice(from, 0, lane); }, `Moved list ${lane.title}`, () => { lists.splice(lists.indexOf(lane), 1); lists.splice(from, 0, lane); });
      };
    }
    root.querySelectorAll('[data-cedit]').forEach(el => el.onclick = () => { ui.editComment = +el.dataset.cedit; render(); const t = $('#cedit-input'); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } });
    root.querySelectorAll('[data-cdel]').forEach(el => el.onclick = () => {
      const c = cards[ui.openCard], i = +el.dataset.cdel, entry = c.comments[i];
      const back = () => { if (!c.comments.includes(entry)) c.comments.splice(Math.min(i, c.comments.length), 0, entry); };
      save(() => { c.comments.splice(c.comments.indexOf(entry), 1); }, back, 'Comment deleted', back);
    });
    const ce = $('#cedit-input'); if (ce) {
      const done = keep => {
        const c = cards[ui.openCard], entry = c.comments[ui.editComment], v = ce.value.trim(), prev = entry.text, prevEd = entry.edited;
        ui.editComment = null;
        if (keep && v && v !== prev) save(() => { entry.text = v; entry.edited = true; }, () => { entry.text = prev; entry.edited = prevEd; }, 'Comment updated');
        else render();
      };
      ce.onkeydown = e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); done(true); } else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(false); } };
      $('#cedit-save').onclick = () => done(true); $('#cedit-cancel').onclick = () => done(false);
    }
    root.querySelectorAll('[data-delcheck]').forEach(el => el.onclick = () => {
      const c = cards[ui.openCard], i = +el.dataset.delcheck, item = c.checklist[i];
      const restore = () => { if (!c.checklist.includes(item)) c.checklist.splice(Math.min(i, c.checklist.length), 0, item); };
      save(() => { c.checklist.splice(c.checklist.indexOf(item), 1); }, restore, 'Checklist item deleted', restore);
    });
    const pq = $('#pm-q'); if (pq) pq.oninput = () => { ui.memQ = pq.value; const pos = pq.selectionStart; render(); const n = $('#pm-q'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } };
    const di = $('#desc-input'); if (di) di.onkeydown = e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); act('save-desc'); } };
    const cn = $('#comment-new'); if (cn) cn.onkeydown = e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $('#comment-form').requestSubmit(); } };
    root.querySelectorAll('[data-act]').forEach(el => {
      if (el.tagName === 'FORM') return;
      el.addEventListener('click', e => {
        if (el.classList.contains('scrim') && e.target !== el) return;
        act(el.dataset.act, el);
      });
    });
    root.querySelectorAll('[data-pop]').forEach(el => el.onclick = e => { e.stopPropagation(); ui.pop = ui.pop === el.dataset.pop ? null : el.dataset.pop; ui.memQ = ''; render(); const f = ui.pop === 'members' && $('#pm-q'); if (f) f.focus(); });
    root.querySelectorAll('[data-moveto]').forEach(el => el.onclick = () => { moveCard(ui.openCard, el.dataset.moveto, null); ui.pop = null; render(); });
    // Every change goes through save(): shown at once, undone if the fake server refuses it.
    const setField = (obj, k, v, msg) => { const prev = obj[k]; save(() => { obj[k] = v; }, () => { obj[k] = prev; }, msg); };
    root.querySelectorAll('[data-mem]').forEach(el => el.onchange = () => { const c = cards[ui.openCard]; setField(c, 'members', el.checked ? [...c.members, el.dataset.mem] : c.members.filter(m => m !== el.dataset.mem)); });
    root.querySelectorAll('[data-lab]').forEach(el => el.onchange = () => { const c = cards[ui.openCard]; setField(c, 'labels', el.checked ? [...c.labels, el.dataset.lab] : c.labels.filter(m => m !== el.dataset.lab)); });
    root.querySelectorAll('[data-check]').forEach(el => el.onchange = () => { setField(cards[ui.openCard].checklist[+el.dataset.check], 'd', el.checked); });
    root.querySelectorAll('[data-brole]').forEach(el => el.onchange = () => { const m = el.dataset.brole;
      if (boardMembers[m] === 'owner' && el.value !== 'owner' && Object.values(boardMembers).filter(r => r === 'owner').length === 1) { toast('A board needs at least one owner. Make someone else an owner first.'); render(); return; }
      setField(boardMembers, m, el.value, `${people[m].name} is now ${el.value === 'owner' ? 'an owner' : el.value === 'member' ? 'a member' : 'an observer'}`); });
    root.querySelectorAll('[data-wrole]').forEach(el => el.onchange = () => {
      const row = wsMembers.find(x => x[0] === el.dataset.wrole);
      if (row[1] === 'Admin' && el.value !== 'Admin' && wsMembers.filter(x => x[1] === 'Admin').length === 1) { toast('A workspace needs at least one admin. Make someone else an admin first.'); render(); return; }
      setField(row, 1, el.value, `${people[row[0]].name} is now ${el.value === 'Admin' ? 'a workspace admin' : 'a workspace member'}`);
    });
    root.querySelectorAll('input[name="vis"]').forEach(el => el.onchange = () => {
      const prev = boardPrivate, next = el.value === 'priv';
      save(() => { boardPrivate = next; }, () => { boardPrivate = prev; }, next ? 'Board is now private' : 'Board is visible to the workspace');
    });
    const title = $('#card-title'); if (title) title.onchange = () => { const v = title.value.trim(); if (v) setField(cards[ui.openCard], 'title', v); else title.value = cards[ui.openCard].title; };
    const due = $('#card-due'); if (due) due.onchange = () => { setField(cards[ui.openCard], 'due', due.value); };
    const bsName = $('#bs-name'); if (bsName) bsName.onchange = () => { const v = bsName.value.trim(), prev = boardName; if (v) save(() => { boardName = v; }, () => { boardName = prev; }); };
    const cf = $('#comment-form'); if (cf) cf.onsubmit = e => {
      e.preventDefault(); const v = $('#comment-new').value.trim(); if (!v) return;
      const c = cards[ui.openCard], entry = { by: me(), at: 'just now', text: v };
      save(() => { c.comments.unshift(entry); }, () => { const i = c.comments.indexOf(entry); if (i >= 0) c.comments.splice(i, 1); });
    };
    const chf = $('#check-form'); if (chf) chf.onsubmit = e => {
      e.preventDefault(); const v = $('#check-new').value.trim(); if (!v) return;
      const c = cards[ui.openCard], item = { t: v, d: false }; ui.allChecks = true;
      save(() => { c.checklist.push(item); }, () => { const i = c.checklist.indexOf(item); if (i >= 0) c.checklist.splice(i, 1); });
      const n = $('#check-new'); if (n) n.focus();
    };
    const apq = $('#ap-q'); if (apq) apq.oninput = () => { ui.apQ = apq.value; const pos = apq.selectionStart; render(); const n = $('#ap-q'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } };
    root.querySelectorAll('[data-addmem]').forEach(el => el.onclick = () => { const id = el.dataset.addmem; ui.apQ = ''; save(() => { boardMembers[id] = 'member'; }, () => { delete boardMembers[id]; }, `${people[id].name} added as a member`); });
    const nb = $('#nb-form'); if (nb) { $('#nb-name').focus(); nb.onsubmit = e => {
      e.preventDefault(); const v = $('#nb-name').value.trim(); if (!v) return;
      const b = { id: 'b' + Date.now(), name: v, color: '--l-docs', priv: $('#nb-priv').checked, lists: 0, cardsN: 0, members: [me()], updated: 'just now' };
      ui.newBoard = false;
      save(() => { boards.push(b); }, () => { const i = boards.indexOf(b); if (i >= 0) boards.splice(i, 1); }, `Created ${v}`);
    }; }
    root.querySelectorAll('[data-retry]').forEach(el => el.onclick = () => { delete loads[el.dataset.retry]; render(); });
    const fq = $('#f-q'); if (fq) fq.oninput = () => { ui.filter.q = fq.value; const pos = fq.selectionStart; render(); const n = $('#f-q'); n.focus(); n.setSelectionRange(pos, pos); };
    ['member', 'label', 'due'].forEach(k => { const s = $('#f-' + k); if (s) s.onchange = () => { ui.filter[k] = s.value; render(); }; });
  }

  function dropTarget(body, y) {
    return [...body.querySelectorAll('.card:not(.dragging)')].find(c => { const r = c.getBoundingClientRect(); return y < r.top + r.height / 2; });
  }
  let laneDrag = null;
  function laneTarget(x) { return [...document.querySelectorAll('.lane:not(.dragging)')].find(l => { const r = l.getBoundingClientRect(); return x < r.left + r.width / 2; }); }
  function clearLaneDrop() { document.querySelectorAll('.lane-drop-before').forEach(x => x.classList.remove('lane-drop-before')); document.querySelectorAll('.lane-drop-end').forEach(x => x.classList.remove('lane-drop-end')); }
  function clearDrop() { document.querySelectorAll('.drop-before').forEach(x => x.classList.remove('drop-before')); document.querySelectorAll('.drop-end').forEach(x => x.classList.remove('drop-end')); }
  function openComposer(lid) { ui.composer = lid; render(); const ta = $('#composer-' + lid); if (ta) ta.focus(); }

  function act(a, el) {
    const c = cards[ui.openCard];
    switch (a) {
      case 'keys': overlay = 'keys'; render(); break;
      case 'close-modal': case 'close-sheet': closeOverlay(); break;
      case 'new-board': ui.newBoard = true; render(); break;
      case 'cancel-board': ui.newBoard = false; render(); break;
      case 'seed-lists': save(() => { lists = [{ id: 'todo', title: 'To do', cards: [] }, { id: 'doing', title: 'Doing', cards: [] }, { id: 'done', title: 'Done', cards: [] }]; }, () => { lists = []; }, 'Added To do, Doing and Done'); break;
      case 'signin': proto.signedIn = true; toast('Signed in as ' + people[me()].name + ' (prototype)'); render(); break;
      case 'resign': proto.fault = 'none'; savePrefs(); loadToken++; toast('Signed in again (prototype). The fault is now None.'); render(); renderPanel(); break;
      case 'add-lane': ui.addingLane = true; render(); { const n = $('#lane-new'); if (n) n.focus(); } break;
      case 'cancel-lane': ui.addingLane = false; render(); break;
      case 'toggle-hide': ui.hideChecked = !ui.hideChecked; ui.allChecks = false; render(); break;
      case 'close-composer': ui.composer = null; render(); break;
      case 'clear-filter': ui.filter = { q: '', member: '', label: '', due: '' }; render(); break;
      case 'edit-desc': ui.editDesc = true; render(); { const t = $('#desc-input'); if (t) t.focus(); } break;
      case 'cancel-desc': ui.editDesc = false; render(); break;
      case 'save-desc': { const v = $('#desc-input').value, prev = c.desc; ui.editDesc = false; save(() => { c.desc = v; }, () => { c.desc = prev; }, 'Description saved'); break; }
      case 'toggle-checks': ui.allChecks = !ui.allChecks; render(); break;
      case 'toggle-feed': ui.allFeed = !ui.allFeed; render(); break;
      case 'copy-link': {
        const link = location.href.split('#')[0] + '#card/' + ui.openCard;
        ui.pop = null;
        try { navigator.clipboard.writeText(link).then(() => toast('Link copied'), () => toast('Copy failed. Select the address bar instead.')); } catch (_) { toast('Copy failed. Select the address bar instead.'); }
        render(); break;
      }
      case 'copy-card': {
        const id = 'TB-' + nextId++;
        const src = ui.openCard, l = lists.find(x => x.cards.includes(src));
        ui.pop = null;
        save(() => {
          cards[id] = clone(c); cards[id].title = c.title + ' (copy)'; cards[id].comments = [];
          l.cards.splice(l.cards.indexOf(src) + 1, 0, id);
        }, () => { const i = l.cards.indexOf(id); if (i >= 0) l.cards.splice(i, 1); delete cards[id]; }, `Copied as ${id}`);
        break;
      }
      case 'archive-card': {
        const id = ui.openCard;
        const l = lists.find(x => x.cards.includes(id)); const idx = l.cards.indexOf(id);
        const restore = () => { if (!l.cards.includes(id)) l.cards.splice(idx, 0, id); };
        closeOverlay();
        const rec = { id, from: l.title, lid: l.id, at: 'just now' };
        const undoArch = () => { restore(); const i = archived.cards.indexOf(rec); if (i >= 0) archived.cards.splice(i, 1); };
        save(() => { l.cards.splice(l.cards.indexOf(id), 1); archived.cards.unshift(rec); }, undoArch, `Archived ${id}. Its comments and checklist stay.`, undoArch);
        break;
      }
      case 'ask-archive': ui.confirmArchive = true; render(); break;
      case 'cancel-archive': ui.confirmArchive = false; render(); break;
      case 'archive-board': ui.confirmArchive = false; overlay = null; save(() => { boardArchived = true; }, () => { boardArchived = false; }, `Archived ${boardName}. Nothing is deleted.`, () => { boardArchived = false; }); location.hash = 'boards'; break;
      case 'restore-board': save(() => { boardArchived = false; }, () => { boardArchived = true; }, `Restored ${boardName}`); break;
    }
  }

  /* ---------- keyboard ---------- */
  document.addEventListener('keydown', e => {
    const t = e.target;
    const typing = t.closest && (t.closest('input, textarea, select, [contenteditable="true"]'));
    if (e.key === 'Escape') {
      if (proto.open) { proto.open = false; renderPanel(); $('#pp-tab').focus(); return; }
      if (ui.pop) { ui.pop = null; render(); return; }
      if (typing && ui.composer && t.closest('[data-composer]')) { ui.composer = null; render(); return; }
      if (typing && ui.editDesc) { ui.editDesc = false; render(); return; }
      if (typing && ui.addingLane && t.closest('#lane-form')) { ui.addingLane = false; render(); return; }
      if (typing) { t.blur(); return; }
      if (overlay) { closeOverlay(); return; }
      if (ui.composer) { ui.composer = null; render(); }
      return;
    }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    const onBoard = !['index', 'sign-in', 'refused', 'members', 'boards', 'archived'].includes(route());
    if (e.key === '?') { e.preventDefault(); overlay = 'keys'; render(); }
    else if (e.key === '/' && onBoard && !overlay) { e.preventDefault(); const f = $('#f-q'); if (f) f.focus(); }
    else if (e.key === 'n' && onBoard && !overlay && canEdit() && boardReady()) { e.preventDefault(); if (limitHit) toast(`This board has reached ${LIMITS.cards.toLocaleString('en-US')} cards. Archive cards to add new ones.`); else openComposer(lists[0].id); }
  });
  document.addEventListener('click', e => { if (ui.pop && !e.target.closest('.pop') && !e.target.closest('[data-pop]')) { ui.pop = null; render(); } });

  /* ---------- prototype controls ---------- */
  $('#viewas').onchange = e => { role = e.target.value; ui.composer = null; ui.pop = null; ui.editDesc = false; render(); };
  function applyTheme() {
    if (theme === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
    document.querySelectorAll('#theme button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === theme)));
  }
  try { theme = localStorage.getItem('tb-theme') || 'system'; } catch (_) {}
  document.querySelectorAll('#theme button').forEach(b => b.onclick = () => { theme = b.dataset.t; try { localStorage.setItem('tb-theme', theme); } catch (_) {} applyTheme(); });
  applyTheme();

  /* ---------- prototype panel ---------- */
  const alarm = () => proto.fault !== 'none' || proto.latency === 'slow' || proto.latency === 'hang';
  function renderProtoChrome() {
    const s = SCENARIOS.find(x => x[0] === proto.scenario)[1];
    const flag = alarm() ? ' · faults on' : '';
    const open = $('#pp-open'), tab = $('#pp-tab');
    open.textContent = `Scenario: ${s}${flag}`; tab.textContent = `Prototype · ${s}${flag}`;
    open.classList.toggle('alarm', alarm()); tab.classList.toggle('alarm', alarm());
    open.setAttribute('aria-expanded', String(proto.open)); tab.setAttribute('aria-expanded', String(proto.open));
  }
  function resetUi() {
    Object.assign(ui, { composer: null, newBoard: false, openCard: 'TB-14', editDesc: false, allChecks: false, allFeed: false, pop: null, filter: { q: '', member: '', label: '', due: '' }, confirmArchive: false, renameLane: null, addingLane: false, hideChecked: false, memQ: '', apQ: '', editComment: null });
  }
  function setScenario(k) {
    proto.scenario = k; loadScenario(k); resetUi(); loadToken++; savePrefs();
    if (k === 'fresh' || k === 'empty') { role = 'admin'; $('#viewas').value = 'admin'; }
  }
  function renderPanel() {
    const host = $('#pp-host');
    renderProtoChrome();
    if (!proto.open) { host.innerHTML = ''; return; }
    const group = (name, legend, items, cur) => `<fieldset><legend>${legend}</legend>${items.map(([k, label, desc]) => `<label class="pp-opt"><input type="radio" name="${name}" value="${k}" ${cur === k ? 'checked' : ''}><span>${label}</span>${desc ? `<small>${desc}</small>` : ''}</label>`).join('')}</fieldset>`;
    host.innerHTML = `<aside class="pp-sheet" role="dialog" aria-labelledby="pp-title">
      <header><h2 id="pp-title">Prototype controls</h2><button type="button" id="pp-close" aria-label="Close prototype controls">${ic('x')}</button></header>
      <p class="pp-note">Not part of Taskboard. Each choice applies to every screen and is remembered on this device. Link straight to a scenario with #trouble, #crowded, #fresh, #empty or #signedout.</p>
      <div class="pp-body">
        ${group('pp-s', 'Scenario', SCENARIOS.map(s => [s[0], s[2], s[3]]), proto.scenario)}
        ${group('pp-l', 'Latency', LATENCY.map(x => [x[0], x[1], x[3]]), proto.latency)}
        ${group('pp-f', 'Faults', FAULTS, proto.fault)}
        <button type="button" class="pp-reset" id="pp-reset">Reset sample data</button>
      </div></aside>`;
    $('#pp-close').onclick = () => { proto.open = false; renderPanel(); };
    host.querySelectorAll('input[name="pp-s"]').forEach(el => el.onchange = () => { setScenario(el.value); toast(`Scenario: ${SCENARIOS.find(x => x[0] === el.value)[2]}`); render(); renderPanel(); });
    host.querySelectorAll('input[name="pp-l"]').forEach(el => el.onchange = () => { proto.latency = el.value; loadToken++; savePrefs(); render(); renderPanel(); });
    host.querySelectorAll('input[name="pp-f"]').forEach(el => el.onchange = () => { proto.fault = el.value; loadToken++; savePrefs(); render(); renderPanel(); });
    $('#pp-reset').onclick = () => { setScenario(proto.scenario); toast('Sample data reset'); render(); renderPanel(); };
  }
  const togglePanel = () => { proto.open = !proto.open; renderPanel(); if (proto.open) { const r = $('#pp-host input:checked'); if (r) r.focus(); } };
  $('#pp-open').onclick = togglePanel;
  $('#pp-tab').onclick = togglePanel;

  let lastKey = null;
  function handleRoute() {
    const r = route();
    if (isScenario(r)) { setScenario(r); location.replace('#boards'); return false; }
    const k = dataKey(r);
    if (k && k !== lastKey) delete loads[k];
    lastKey = k;
    return true;
  }
  window.addEventListener('hashchange', () => {
    if (!handleRoute()) return;
    const r = route();
    if (r === 'filter') { ui.filter = { q: '', member: '', label: 'docs', due: '' }; }
    if (overlay === 'keys' && r !== 'shortcuts') overlay = null; // leaving a page closes the shortcuts sheet
    ui.pop = null;
    render();
  });
  $('#viewas').value = role; // browsers restore form values on reload; keep the switch in step with the page
  loadPrefs();
  loadScenario(proto.scenario);
  if (handleRoute()) {
    if (route() === 'filter') ui.filter.label = 'docs';
    render();
  }
  renderPanel();
})();
</script>
