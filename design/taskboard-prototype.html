<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taskboard Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* tokens */
/* Layout: a thin prototype strip, then the app: app bar, page header, content (board = horizontal lanes). */
:root {
  --bg: #f3f5f2; --surface: #ffffff; --surface-2: #e9ede8; --surface-3: #dfe5de;
  --line: #d3dad2; --fg: #1b2420; --muted: #5a675f; --faint: #8a968e;
  --accent: #1d6b57; --accent-fg: #ffffff; --accent-soft: #d8ede5;
  --warn: #a95c08; --warn-soft: #fbead3; --danger: #b3261e; --danger-soft: #fbe3df; --ok: #2c7a3a; --ok-soft: #dcf0df;
  --proto-bg: #26302b; --proto-fg: #dbe4de;
  --l-launch: #2f8a5f; --l-bug: #c4473a; --l-docs: #3769b0; --l-ops: #c27d14; --l-marketing: #9b4f9a; --l-research: #5f6f78; --l-design: #6a55b8;
  --radius-s: 6px; --radius-m: 10px; --radius-l: 14px;
  --shadow-1: 0 1px 2px rgba(18, 30, 24, .08), 0 0 0 1px rgba(18, 30, 24, .04);
  --shadow-2: 0 18px 48px rgba(18, 30, 24, .22);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --surface: #19201c; --surface-2: #212924; --surface-3: #2a332d;
    --line: #2e3832; --fg: #e4ebe6; --muted: #9eaba3; --faint: #6f7c74;
    --accent: #5cc4a3; --accent-fg: #0b1a14; --accent-soft: #1b3a30;
    --warn: #eaa452; --warn-soft: #3a2914; --danger: #f2857a; --danger-soft: #3d1c19; --ok: #73c785; --ok-soft: #1c3622;
    --proto-bg: #0a0e0c; --proto-fg: #c9d4cd;
    --l-launch: #4fb383; --l-bug: #e06a5c; --l-docs: #6d9ae0; --l-ops: #e0a142; --l-marketing: #c47bc3; --l-research: #8d9ca5; --l-design: #9a87e6;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .4), 0 0 0 1px rgba(255, 255, 255, .04);
    --shadow-2: 0 18px 48px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --surface: #19201c; --surface-2: #212924; --surface-3: #2a332d;
  --line: #2e3832; --fg: #e4ebe6; --muted: #9eaba3; --faint: #6f7c74;
  --accent: #5cc4a3; --accent-fg: #0b1a14; --accent-soft: #1b3a30;
  --warn: #eaa452; --warn-soft: #3a2914; --danger: #f2857a; --danger-soft: #3d1c19; --ok: #73c785; --ok-soft: #1c3622;
  --proto-bg: #0a0e0c; --proto-fg: #c9d4cd;
  --l-launch: #4fb383; --l-bug: #e06a5c; --l-docs: #6d9ae0; --l-ops: #e0a142; --l-marketing: #c47bc3; --l-research: #8d9ca5; --l-design: #9a87e6;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4), 0 0 0 1px rgba(255, 255, 255, .04);
  --shadow-2: 0 18px 48px rgba(0, 0, 0, .55);
  color-scheme: dark;
}
/* end tokens */

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 400 14px/1.45 var(--font-body); display: flex; flex-direction: column; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--proto-bg); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: 24px; } h2 { font-size: 18px; } h3 { font-size: 15px; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: 11px; letter-spacing: .02em; }
.muted { color: var(--muted); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* prototype strip */
.proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--proto-bg); color: var(--proto-fg); display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s4); padding-block: 6px; font-size: 12px; }
.proto b { font-family: var(--font-display); font-size: 13px; color: #fff; }
.proto .tag { opacity: .75; }
.proto .spacer { flex: 1; }
.proto label { display: inline-flex; align-items: center; gap: 6px; }
.proto select, .proto .seg button { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); border-radius: var(--radius-s); padding: 3px 8px; color: var(--proto-fg); }
.proto select option { color: #111; }
.proto a { color: var(--proto-fg); }
.seg { display: inline-flex; gap: 2px; }
.seg button { cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--proto-fg); color: var(--proto-bg); }
.statebar { background: var(--surface-2); border-bottom: 1px dashed var(--line); display: flex; align-items: center; gap: var(--s2); padding-block: 5px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.statebar .seg button { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 2px 8px; color: var(--fg); }
.statebar .seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.proto .pp-open { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); border-radius: var(--radius-s); padding: 3px 8px; color: var(--proto-fg); cursor: pointer; }
.proto .pp-open.alarm, .pp-tab.alarm { background: var(--danger); border-color: var(--danger); color: #fff; }
/* prototype panel (not part of the product) */
.pp-tab { position: fixed; z-index: 60; right: env(safe-area-inset-right, 0px); top: 50%; transform: translateY(-50%); writing-mode: vertical-rl; background: var(--proto-bg); color: var(--proto-fg); border: 0; border-radius: 8px 0 0 8px; padding: 12px 5px; font-size: 12px; font-weight: 600; letter-spacing: .03em; cursor: pointer; box-shadow: var(--shadow-1); }
.pp-sheet { position: fixed; z-index: 90; top: 0; right: 0; bottom: 0; width: min(380px, 100%); background: var(--proto-bg); color: var(--proto-fg); display: flex; flex-direction: column; box-shadow: var(--shadow-2); padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); font-size: 13px; }
.pp-sheet header { display: flex; align-items: center; gap: var(--s2); padding: 14px 16px 4px; }
.pp-sheet header h2 { flex: 1; font-size: 15px; color: #fff; }
.pp-sheet header button { background: none; border: 0; color: inherit; cursor: pointer; padding: 4px; }
.pp-sheet .pp-note { margin: 0 16px 8px; opacity: .75; font-size: 12px; }
.pp-body { overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 16px; }
.pp-body fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.pp-body legend { font-weight: 600; color: #fff; margin-bottom: 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.pp-opt { display: grid; grid-template-columns: 18px 1fr; gap: 0 8px; padding: 6px 8px; border-radius: var(--radius-s); cursor: pointer; }
.pp-opt:hover { background: rgba(255,255,255,.06); }
.pp-opt input { margin: 3px 0 0; accent-color: var(--accent); }
.pp-opt small { grid-column: 2; opacity: .7; font-size: 12px; }
.pp-body .pp-reset { align-self: flex-start; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: inherit; border-radius: var(--radius-s); padding: 5px 10px; cursor: pointer; }
.netbanner { display: flex; align-items: center; gap: var(--s2); padding-block: 7px; background: var(--danger-soft); color: var(--danger); font-size: 13px; border-bottom: 1px solid var(--line); }
.saving { position: fixed; z-index: 70; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--surface); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 12px; box-shadow: var(--shadow-1); }
.saving[hidden] { display: none; }
.saving.late { color: var(--warn); border-color: var(--warn); }
.board-tile strong, .lane-head h3 { overflow-wrap: anywhere; }
.filterbar[hidden] { display: none; }

/* buttons, inputs */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-s); padding: 6px 12px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.danger.solid { background: var(--danger); color: #fff; }
.btn.sm { padding: 3px 8px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { border: 0; background: transparent; border-radius: var(--radius-s); padding: 5px; cursor: pointer; color: var(--muted); display: inline-grid; place-items: center; }
.icon-btn:hover { background: var(--surface-2); color: var(--fg); }
.input, select.input, textarea.input { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-s); padding: 6px 10px; min-width: 0; }
textarea.input { width: 100%; resize: vertical; }
.input:disabled { background: var(--surface-2); color: var(--muted); }
svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* app chrome */
#screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.appbar { display: flex; align-items: center; gap: var(--s3); padding-block: 10px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 16px; color: var(--fg); text-decoration: none; }
.mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px; padding: 4px; }
.mark i { background: var(--accent-fg); border-radius: 1px; opacity: .9; }
.mark i:nth-child(1) { height: 100%; } .mark i:nth-child(2) { height: 65%; } .mark i:nth-child(3) { height: 40%; }
.crumbs { display: flex; align-items: center; gap: 6px; color: var(--muted); min-width: 0; }
.crumbs a { color: var(--muted); text-decoration: none; } .crumbs a:hover { color: var(--fg); }
.appbar .spacer { flex: 1; }
.me { display: inline-flex; align-items: center; gap: 8px; }
.me small { display: block; color: var(--muted); font-size: 12px; line-height: 1.2; }
.navlink { color: var(--fg); text-decoration: none; padding: 4px 8px; border-radius: var(--radius-s); }
.navlink:hover, .navlink.on { background: var(--surface-2); }

.avatar { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 600; color: #fff; flex: none; border: 2px solid var(--surface); }
.avatar.lg { width: 32px; height: 32px; font-size: 12px; }
.stack { display: inline-flex; } .stack .avatar + .avatar { margin-left: -7px; }

.page { padding-block: var(--s5); width: 100%; max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--s5); }
.page-head { display: flex; align-items: flex-end; gap: var(--s4); flex-wrap: wrap; }
.page-head > div { flex: 1; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.banner { display: flex; align-items: center; gap: var(--s2); padding: 8px 12px; border-radius: var(--radius-s); background: var(--warn-soft); color: var(--warn); font-size: 13px; }

/* index */
.idx-intro { max-width: 68ch; color: var(--muted); }
.idx-group h2 { margin-bottom: var(--s3); display: flex; gap: var(--s2); align-items: baseline; }
.idx-group h2 span { font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--s3); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); padding: var(--s4); text-decoration: none; color: var(--fg); display: flex; flex-direction: column; gap: 6px; }
.tile:hover { border-color: var(--accent); }
.tile strong { font-family: var(--font-display); font-size: 15px; }
.tile span { color: var(--muted); font-size: 13px; }
.tile code { color: var(--faint); font-family: var(--font-mono); font-size: 11px; margin-top: auto; }
.pretend { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius-m); padding: var(--s4); color: var(--muted); }
.pretend ul { margin: 6px 0 0; padding-left: 18px; }

/* sign in */
.center { flex: 1; display: grid; place-items: center; padding-block: var(--s6); }
.signin { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-l); padding: var(--s6) var(--s5); display: flex; flex-direction: column; gap: var(--s4); box-shadow: var(--shadow-1); }
.signin .brand { font-size: 20px; }
.signin .btn { justify-content: center; padding: 10px 14px; }
.fine { font-size: 12.5px; color: var(--muted); }
.refused-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--danger-soft); color: var(--danger); display: grid; place-items: center; }
.kv { background: var(--surface-2); border-radius: var(--radius-s); padding: 8px 10px; font-size: 13px; overflow-wrap: anywhere; }

/* boards list */
.boards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: var(--s3); }
.board-tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); padding: var(--s4); display: flex; flex-direction: column; gap: var(--s3); cursor: pointer; text-align: left; min-height: 132px; }
.board-tile:hover { border-color: var(--accent); }
.board-tile .top { display: flex; align-items: center; gap: var(--s2); }
.board-tile .sq { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.board-tile strong { font-family: var(--font-display); font-size: 16px; flex: 1; min-width: 0; }
.board-tile .meta { color: var(--muted); font-size: 12.5px; display: flex; gap: var(--s2); flex-wrap: wrap; }
.board-tile .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: var(--s2); }
.new-tile { border: 1.5px dashed var(--line); background: transparent; color: var(--muted); display: grid; place-items: center; font-weight: 500; }
.new-form { border-style: solid; cursor: default; }
.skel { background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2)); background-size: 200% 100%; animation: sh 1.4s infinite linear; border-radius: var(--radius-m); }
@keyframes sh { to { background-position: -200% 0; } }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius-l); padding: var(--s6) var(--s5); text-align: center; display: flex; flex-direction: column; gap: var(--s3); align-items: center; }
.empty p { margin: 0; color: var(--muted); max-width: 46ch; }
.error { border-color: var(--danger); background: var(--danger-soft); }
.error h2 { color: var(--danger); }

/* board */
.board-head { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; padding-block: var(--s4) var(--s3); }
.board-head h1 { margin-right: var(--s1); }
.board-head .spacer { flex: 1; }
.filterbar { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; padding-block: 0 var(--s3); }
.filterbar .input { padding: 5px 9px; font-size: 13px; }
.filterbar .search { position: relative; flex: 0 1 240px; min-width: 160px; display: flex; }
.filterbar .search input { width: 100%; padding-left: 28px; }
.filterbar .search svg { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.filterbar .count { font-size: 12.5px; color: var(--muted); }
.lanes-wrap { flex: 1; min-height: 0; overflow-x: auto; padding-bottom: var(--s4); }
.lanes { display: flex; gap: var(--s3); align-items: flex-start; min-height: 100%; }
.lane { background: var(--surface-2); border-radius: var(--radius-m); width: 272px; flex: none; display: flex; flex-direction: column; max-height: calc(100vh - 230px); }
.lane-head { display: flex; align-items: center; gap: var(--s2); padding: 10px 10px 6px 12px; }
.lane-head h3 { flex: 1; font-size: 14px; }
.lane-head .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lane-body { padding: 2px 8px 8px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 24px; }
.lane-body.drop-end::after { content: ""; height: 3px; border-radius: 2px; background: var(--accent); }
.card { background: var(--surface); border-radius: var(--radius-s); box-shadow: var(--shadow-1); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; position: relative; text-align: left; border: 0; width: 100%; }
.card:hover { box-shadow: var(--shadow-1), 0 0 0 1.5px var(--accent); }
.card[draggable="true"] { cursor: grab; }
.card.dragging { opacity: .4; }
.card.drop-before::before { content: ""; position: absolute; left: 0; right: 0; top: -6px; height: 3px; border-radius: 2px; background: var(--accent); }
.card .labels { display: flex; gap: 4px; flex-wrap: wrap; }
.lbl { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 1px 7px 1px 6px; border-radius: 4px; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c); }
.lbl::before { content: ""; width: 6px; height: 6px; border-radius: 2px; background: var(--c); }
.card .title { font-weight: 500; overflow-wrap: anywhere; }
.badges { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
.badges .b { display: inline-flex; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; }
.badges .b svg.i { width: 13px; height: 13px; }
.due { padding: 1px 6px; border-radius: 4px; }
.due.over { background: var(--danger-soft); color: var(--danger); }
.due.soon { background: var(--warn-soft); color: var(--warn); }
.b.done { color: var(--ok); }
.badges .stack { margin-left: auto; }
.badges .avatar { width: 22px; height: 22px; font-size: 10px; }
.card .cid { position: absolute; right: 8px; top: 7px; color: var(--faint); }
.add-card { border: 0; background: transparent; color: var(--muted); text-align: left; padding: 6px 8px; border-radius: var(--radius-s); cursor: pointer; display: flex; align-items: center; gap: 6px; margin: 0 8px 8px; }
.add-card:hover { background: var(--surface-3); color: var(--fg); }
.composer { margin: 0 8px 8px; display: flex; flex-direction: column; gap: 6px; }
.composer textarea { min-height: 60px; }
.composer .row { display: flex; gap: 6px; align-items: center; }
.add-lane { width: 272px; flex: none; border: 1.5px dashed var(--line); border-radius: var(--radius-m); background: transparent; padding: 12px; color: var(--muted); cursor: pointer; text-align: left; display: flex; gap: 6px; align-items: center; }
.add-lane:hover { color: var(--fg); border-color: var(--muted); }

/* overlays */
.scrim { position: fixed; inset: 0; background: rgba(10, 16, 13, .45); z-index: 40; display: flex; justify-content: center; align-items: flex-start; padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.modal { background: var(--surface); border-radius: var(--radius-l); box-shadow: var(--shadow-2); width: min(920px, 100%); display: flex; flex-direction: column; max-height: calc(100vh - 48px); }
.modal-top { display: flex; align-items: center; gap: var(--s2); padding: 10px 12px 10px 18px; border-bottom: 1px solid var(--line); }
.modal-top .where { flex: 1; color: var(--muted); font-size: 13px; min-width: 0; }
.modal-cols { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); min-height: 0; flex: 1; }
.modal-cols > section { overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.modal-cols > section + section { border-left: 1px solid var(--line); background: var(--bg); }
